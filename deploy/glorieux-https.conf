<VirtualHost *:443>
 ServerName glorieux.snoopup.io
 SSLEngine on
 SSLCertificateFile /etc/letsencrypt/live/glorieux.snoopup.io/fullchain.pem
 SSLCertificateKeyFile /etc/letsencrypt/live/glorieux.snoopup.io/privkey.pem
 ProxyPreserveHost On
 RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
 ProxyPass / http://127.0.0.1:8017/
 ProxyPassReverse / http://127.0.0.1:8017/
 RequestHeader set X-Forwarded-Proto "https"
 Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=()"
 Header always set Referrer-Policy "same-origin"
 SetEnvIf Request_URI "^/(billet/|q/|verification/email/|mot-de-passe/)" private_request
 CustomLog /var/log/httpd/glorieux-access.log combined env=!private_request
 ErrorLog /var/log/httpd/glorieux-error.log
</VirtualHost>
