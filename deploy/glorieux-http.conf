<VirtualHost *:80>
 ServerName glorieux.snoopup.io
 ProxyPreserveHost On
 RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
 Alias /.well-known/acme-challenge/ /var/www/glorieux-acme/.well-known/acme-challenge/
 <Directory /var/www/glorieux-acme>
  Require all granted
 </Directory>
 ProxyPass /.well-known/acme-challenge/ !
 ProxyPass / http://127.0.0.1:8017/
 ProxyPassReverse / http://127.0.0.1:8017/
 RequestHeader set X-Forwarded-Proto "http"
 # Do not record private ticket or account validation tokens in access logs.
 SetEnvIf Request_URI "^/(billet/|q/|verification/email/|mot-de-passe/)" private_request
 CustomLog /var/log/httpd/glorieux-access.log combined env=!private_request
 ErrorLog /var/log/httpd/glorieux-error.log
</VirtualHost>
